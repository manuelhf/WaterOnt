[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wateront"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["wntr>=1.2", "networkx>=3.0", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "rdflib>=7.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
neo4j = ["neo4j>=5.14"]
demo = ["gradio>=4.0", "matplotlib"]

[tool.setuptools]
packages = ["wateront"]

[tool.setuptools.package-data]
wateront = ["web_template.html"]
